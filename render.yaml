# Render blueprint for the LHIMS backend.
#
# Deploy: push this repo to GitHub, then in Render choose "New +" -> "Blueprint"
# and point it at this repository. Render reads this file, creates the web
# service and generates the JWT secrets.
#
# The database is NOT created here. Render's free Postgres expires after a fixed
# window and takes the data with it, which is no good even for a demo. Bring your
# own Postgres instead - Neon's free tier does not expire - and set these when
# Render prompts (all marked sync:false):
#
#   DATABASE_URL   the POOLED address (Neon: the host contains "-pooler")
#   DIRECT_URL     the same address WITHOUT "-pooler"; Prisma migrates over this
#   FRONTEND_URL   the GitHub Pages origin, e.g. https://<you>.github.io
#   FRONTEND_URLS  same, plus any other origin that may call the API
#   SEED_ADMIN_PASSWORD / SEED_ADMIN_EMAIL  the platform operator account
#
# See docs/DEPLOY_NEON_RENDER.md for the whole walkthrough.

services:
  - type: web
    name: diagnosis-center-backend
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm run render:build
    startCommand: npm run render:start
    # /ready returns 503 when Postgres is unavailable, so traffic is not routed
    # to an instance that cannot serve tenant data.
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PREFIX
        value: /api
      # Pooled address: what the running app connects with.
      - key: DATABASE_URL
        sync: false
      # Unpooled address: what Prisma runs migrations over. A pooler cannot carry
      # the advisory locks and DDL a migration needs.
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      # Cross-origin cookies (GitHub Pages -> onrender.com) require SameSite=None,
      # which the backend automatically pairs with Secure.
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: combined
      - key: ENABLE_API_DOCS
        value: "false"
      - key: BODY_LIMIT
        value: 10mb
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "240"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "300000"
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: UPLOAD_STORAGE_DRIVER
        value: local
      - key: UPLOAD_ROOT
        value: uploads
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: SIGNED_FILE_URL_TTL_MINUTES
        value: "15"
      - key: DICOM_GATEWAY_MODE
        value: metadata-only
      # Set these in the Render dashboard after the first deploy.
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      # Where the web app lives (the Vercel site, served at the root): emailed links (confirm your
      # email address) are built from this, never from a request header.
      - key: FRONTEND_APP_URL
        value: https://lhims-frontend.vercel.app
      # Real email: set MAIL_DRIVER to resend in the dashboard once these two are
      # filled in. Until then verification emails report "not set up" instead of
      # pretending to send.
      - key: RESEND_API_KEY
        sync: false
      # Or, with no domain: MAIL_DRIVER=brevo, BREVO_API_KEY, and MAIL_FROM set to a
      # sender address verified in Brevo (a single address is enough).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Platform operator account (signs in with no facility code).
      - key: SEED_ADMIN_USERNAME
        value: platform
      # "true" also seeds the DEMO facility, with shared staff logins people can
      # explore. For a demonstration instance only: never on one holding real
      # patient data. See docs/DEPLOY_NEON_RENDER.md.
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SEED_ADMIN_EMAIL
        sync: false
